# docker compose up --build      then open http://localhost:7860
#
# Index a folder other than ./data:   DATA_PATH="D:/College Notes" docker compose up
# The Ollama model is downloaded from the app ("Download model" button) on first use.
services:
  app:
    build: .
    ports:
      - "${DOCTRACE_PORT:-7860}:7860"
    volumes:
      - "${DATA_PATH:-./data}:/data:ro"
      - index:/index
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      DOCTRACE_WATCH_MINUTES: ${DOCTRACE_WATCH_MINUTES:-10}   # re-scan the folder every 10 minutes
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # NVIDIA GPU? uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  index:
  ollama:
